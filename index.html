<!doctype html>
<html lang="en">

    <main id="start-screen" class="start-screen">
      <button id="start-button" type="button">Spiel starten</button>

          <h1 id="credits-title" tabindex="-1">Credits</h1>
          <p>bla bla bla blub</p>

    <div id="game-over" class="game-over" hidden>

    </div>
