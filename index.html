<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <title>Document</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="stylesheet" href="assets/css/standard.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="start-screen" class="start-screen">
      <nav class="start-menu" aria-label="Hauptmenü">
        <button id="start-button" type="button">Spiel starten</button>
        <button id="settings-button" type="button">Einstellungen</button>
        <button id="credits-button" type="button">Credits</button>
        <button id="imprint-button" type="button">Impressum</button>
      </nav>
      <div class="character-choices" role="group" aria-label="Character auswählen">
        <button class="character-choice character-choice--female selected" type="button" data-character="female" aria-pressed="true">
          <span class="character-sprite character-sprite--female" aria-hidden="true"></span>
        </button>
        <button class="character-choice character-choice--male" type="button" data-character="male" aria-pressed="false">
          <span class="character-sprite character-sprite--male" aria-hidden="true"></span>
        </button>
      </div>
      <dialog id="settings-overlay" class="settings-panel" aria-labelledby="settings-title">
        <div class="dialog-content">
          <h1 id="settings-title" tabindex="-1">Einstellungen</h1>
          <button id="settings-back-button" type="button">Zurück</button>
        </div>
      </dialog>
      <dialog id="credits-overlay" class="credits-panel" aria-labelledby="credits-title">
        <div class="dialog-content">
          <h1 id="credits-title">Credits</h1>
          <p>bla bla bla blub</p>
          <p>bla bla bla blub</p>
          <button id="credits-back-button" type="button">Zurück</button>
        </div>
      </dialog>
      <dialog id="imprint-overlay" class="imprint-panel" aria-labelledby="imprint-title">
        <div class="dialog-content">
          <h1 id="imprint-title" tabindex="-1">Impressum</h1>
          <button id="imprint-back-button" type="button">Zurück</button>
        </div>
      </dialog>
    </main>
    <canvas id="canvas" width="720" height="480"> </canvas>
    <div id="pause-screen" class="pause-screen" hidden>
      <section class="pause-screen-content" aria-label="Spiel pausiert">
        <h1>Pause</h1>
        <p>Esc zum Fortsetzen</p>
        <button id="pause-main-menu-button" type="button">Hauptmenü</button>
      </section>
    </div>
    <div id="game-over" class="game-over" hidden>
      <section class="game-over-screen" aria-label="Game Over">
        <canvas id="game-over-character" width="720" height="480" aria-hidden="true"></canvas>
        <div class="game-over-actions">
          <button id="restart-button" type="button">Erneut spielen</button>
          <button id="main-menu-button" type="button">Hauptmenü</button>
        </div>
      </section>
    </div>

    <script src="assets/js/models/game-loop.class.js"></script>
    <script src="assets/js/models/drawable-object.class.js"></script>
    <script src="assets/js/models/charge-item.class.js"></script>
    <script src="assets/js/models/movable-object.class.js"></script>
    <script src="assets/js/models/male-character.class.js"></script>
    <script src="assets/js/models/female-character.class.js"></script>
    <script src="assets/js/models/enemies.class.js"></script>
    <script src="assets/js/models/final-boss.class.js"></script>
    <script src="assets/js/models/clouds.class.js"></script>
    <script src="assets/js/models/background.class.js"></script>
    <script src="assets/js/models/keyboard.class.js"></script>
    <script src="assets/js/models/status-bar.class.js"></script>
    <script src="assets/js/models/level.class.js"></script>
    <script src="assets/js/level/level1.js"></script>
    <script src="assets/js/models/world.class.js"></script>
    <script src="assets/js/game.js"></script>
    <script src="script.js"></script>
  </body>
</html>
