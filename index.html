<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <title>Document</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="stylesheet" href="assets/css/standard.css" />
    <link rel="stylesheet" href="assets/css/start-screen.css" />
    <link rel="stylesheet" href="assets/css/dialogs.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="start-screen" class="start-screen is-pre-start">
      <button id="pre-start-button" class="pre-start-prompt" type="button">
        <span>Klicken, um zu starten</span>
      </button>
      <nav class="start-menu" aria-label="Hauptmenü" inert>
        <button id="start-button" type="button">Spiel starten</button>
        <button id="settings-button" type="button">Einstellungen</button>
        <button id="credits-button" type="button">Credits</button>
        <button id="imprint-button" type="button">Impressum</button>
      </nav>
      <div id="character-choices" class="character-choices" role="group" aria-label="Character auswählen" inert>
        <button class="character-choice character-choice-female selected" type="button" data-character="female" aria-label="Weiblicher Character" aria-pressed="true">
          <span class="character-sprite character-sprite-female" aria-hidden="true"></span>
        </button>
        <button class="character-choice character-choice-male" type="button" data-character="male" aria-label="Männlicher Character" aria-pressed="false">
          <span class="character-sprite character-sprite-male" aria-hidden="true"></span>
        </button>
      </div>
      <dialog id="imprint-overlay" class="imprint-panel" aria-labelledby="imprint-title">
        <div class="dialog-content">
          <h1 id="imprint-title" tabindex="-1">Impressum</h1>
          <button id="imprint-back-button" type="button">Zurück</button>
        </div>
      </dialog>
    </main>
    <dialog id="credits-overlay" class="credits-panel" aria-labelledby="credits-title">
      <div class="dialog-content">
        <h1 id="credits-title">Credits</h1>
        <p>bla bla bla blub</p>
        <p>bla bla bla blub</p>
        <button id="credits-back-button" type="button">Zurück</button>
      </div>
    </dialog>
    <canvas id="canvas" width="720" height="480"> </canvas>
    <div id="pause-screen" class="pause-screen" hidden>
      <section class="pause-screen-content" aria-label="Spiel pausiert">
        <h1>Pause</h1>
        <p>Esc zum Fortsetzen</p>
        <button id="pause-settings-button" type="button">Einstellungen</button>
        <button id="pause-restart-button" type="button">Restart</button>
        <button id="pause-main-menu-button" type="button">Hauptmenü</button>
      </section>
    </div>
    <dialog id="settings-overlay" class="settings-panel" aria-labelledby="settings-title">
      <div class="dialog-content">
        <h1 id="settings-title" tabindex="-1">Einstellungen</h1>
        <fieldset class="settings-audio">
          <legend>Audio</legend>
          <div class="audio-setting">
            <label for="master-volume">Gesamtlautstärke</label>
            <span class="audio-setting-control">
              <button id="audio-mute-button" class="audio-mute-button" type="button" aria-label="Ton ausschalten" aria-pressed="false">
                <svg data-muted-icon viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 9v6h4l5 4V5L7 9H3Z" fill="currentColor" />
                  <path d="m16 9 5 6m0-6-5 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
                </svg>
                <svg data-unmuted-icon viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 9v6h4l5 4V5L7 9H3Z" fill="currentColor" />
                  <path d="M16 9a5 5 0 0 1 0 6m2-9a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
                </svg>
              </button>
              <input id="master-volume" type="range" min="0" max="100" step="1" value="100" />
              <output id="master-volume-value" for="master-volume">100%</output>
            </span>
          </div>
          <div class="audio-setting">
            <label for="music-volume">Musik</label>
            <span class="audio-setting-control">
              <input id="music-volume" type="range" min="0" max="100" step="1" value="100" />
              <output id="music-volume-value" for="music-volume">100%</output>
            </span>
          </div>
          <div class="audio-setting">
            <label for="sound-effects-volume">Soundeffekte</label>
            <span class="audio-setting-control">
              <input id="sound-effects-volume" type="range" min="0" max="100" step="1" value="100" />
              <output id="sound-effects-volume-value" for="sound-effects-volume">100%</output>
            </span>
          </div>
        </fieldset>
        <button id="settings-back-button" type="button">Zurück</button>
      </div>
    </dialog>
    <div id="game-over" class="game-over" hidden>
      <section class="game-over-screen" aria-label="Game Over">
        <canvas id="game-over-character" width="720" height="480" aria-hidden="true"></canvas>
        <div class="game-over-actions">
          <button id="restart-button" type="button">Erneut spielen</button>
          <button id="main-menu-button" type="button">Hauptmenü</button>
        </div>
      </section>
    </div>
    <div id="victory-screen" class="victory-screen" hidden>
      <section class="victory-screen-content" aria-labelledby="victory-title">
        <h1 id="victory-title">SIEG!</h1>
        <dl class="victory-screen-stats">
          <div>
            <dt>Spielzeit</dt>
            <dd id="victory-play-time">00:00:000</dd>
          </div>
          <div>
            <dt>Münzen</dt>
            <dd id="victory-coins">0</dd>
          </div>
          <div>
            <dt>Besiegte Gegner</dt>
            <dd id="victory-defeated-enemies">0</dd>
          </div>
        </dl>
        <div class="victory-screen-actions">
          <button id="victory-restart-button" class="victory-restart-button" type="button">Nochmal spielen</button>
          <button id="victory-main-menu-button" type="button">Hauptmenü</button>
          <button id="victory-credits-button" type="button">Credits</button>
        </div>
      </section>
    </div>
    <div id="screen-transition" aria-hidden="true"></div>

    <script src="assets/js/lib/howler.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
